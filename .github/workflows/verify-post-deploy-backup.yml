name: Verify app healthy post-deploy (reusable)

# Phase 0 scope: confirms the application is reported running by Coolify after a deploy.
# Full backup-content verification (checksum a real backup file, test-restore it) is
# Phase 4 scope and is not implemented here — this is a real, narrower check, not a stub.
#
# Polls rather than checking once: triggering a deploy only queues it (proven this session
# — GET /api/v1/deploy?uuid= returns "queued" immediately, the actual deploy takes anywhere
# from ~15s to a couple of minutes to reach a terminal state), so a caller that runs this
# workflow right after trigger-coolify-deploy.yml needs it to wait for a real outcome, not
# sample the in-between state.

on:
  workflow_call:
    inputs:
      app-uuid:
        description: Coolify application UUID to check
        type: string
        required: true
    secrets:
      coolify-url:
        required: true
      coolify-api-token:
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Poll application status until stably running or timeout
        # A single running:* read is not enough: a crash-looping container can be sampled
        # mid-restart and read as running for one poll, then die again seconds later —
        # observed for real deploying metamcp, where a Postgres permission error caused a
        # crash loop that a single-sample check reported as a false-positive success.
        # Require 3 CONSECUTIVE running:* reads (30s stable) before declaring success; any
        # non-running read resets the streak.
        run: |
          set -euo pipefail
          consecutive=0
          required=3
          for i in $(seq 1 24); do
            status=$(curl -sf -H "Authorization: Bearer ${{ secrets.coolify-api-token }}" \
              "${{ secrets.coolify-url }}/api/v1/applications/${{ inputs.app-uuid }}" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('status',''))")
            case "$status" in
              running:*)
                consecutive=$((consecutive + 1))
                echo "[$i] status: $status (consecutive: $consecutive/$required)"
                if [ "$consecutive" -ge "$required" ]; then
                  echo "OK: application has been running for $required consecutive checks"
                  exit 0
                fi
                ;;
              *)
                echo "[$i] status: $status (resetting consecutive count)"
                consecutive=0
                ;;
            esac
            sleep 10
          done
          echo "FAIL: application never reached $required consecutive running:* reads within the timeout"
          exit 1
