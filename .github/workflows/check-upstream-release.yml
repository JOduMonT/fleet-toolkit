name: Check upstream release (reusable)

# Runs Renovate against the calling repo to open/update version-bump PRs.
# Callers need a renovate.json in their own repo root (config:recommended is enough).

on:
  workflow_call: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.2
        with:
          configurationFile: renovate.json
          token: ${{ github.token }}
        env:
          # Without this Renovate has no repository list, logs
          # "WARN: No repositories found - did you want to run with flag
          # --autodiscover?", scans nothing, and still exits 0 — so the job went
          # green while never once looking for an upstream release.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
