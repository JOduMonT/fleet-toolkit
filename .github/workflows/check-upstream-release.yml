name: Check upstream release (reusable)

# Runs Renovate against the calling repo to open/update version-bump PRs.
# Callers need a renovate.json in their own repo root (config:recommended is enough).

on:
  workflow_call: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Renovate
        uses: renovatebot/github-action@v40.3.7
        with:
          configurationFile: renovate.json
          token: ${{ github.token }}
