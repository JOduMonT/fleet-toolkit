name: Lint docker-compose (reusable)

on:
  workflow_call:
    inputs:
      compose-file:
        description: Path to the docker-compose file to validate
        type: string
        default: docker-compose.yaml
      env-file:
        description: Path to an .env file with values for variable interpolation (e.g. dummy values for required secrets)
        type: string
        default: .env.example

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file syntax
        run: |
          cp "${{ inputs.env-file }}" .env
          docker compose -f "${{ inputs.compose-file }}" config -q
